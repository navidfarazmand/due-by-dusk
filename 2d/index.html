<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Due by Dusk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil:opsz,wght@10..72,700..900&family=Courier+Prime:wght@400;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: the field is the stage; a column of green ledger paper (the bank's notice, the shed, perks, heirlooms) sits beside it and stacks under it on phones */
:root{
  --page:#e3eadb; --paper:#f6f9f0; --ink:#1b2620; --ink-2:#556358; --rule:#c6d4be; --margin:#d58a7e;
  --barn:#a9372a; --barn-ink:#fff7f0; --leaf:#2b6a36; --hay:#9a6608;
  --hud-bg:rgba(16,20,16,.62); --hud-fg:#fbf6e8; --hud-gold:#ffd25a; --hud-red:#ff7a5c;
  --sun-a:#ffe08a; --sun-b:#ff9b5c; --stage-bg:#3b2a1d; --scrim:rgba(8,12,9,.62);
  --shadow:0 1px 0 rgba(27,38,32,.05), 0 10px 26px -16px rgba(27,38,32,.35);
  --font-display:"Big Shoulders Stencil","Arial Narrow",Impact,sans-serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-type:"Courier Prime","Courier New",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#101611; --paper:#19211b; --ink:#e5ece2; --ink-2:#9db0a1; --rule:#2c3a2f; --margin:#7d3d34;
    --barn:#e2654f; --barn-ink:#1b0e0a; --leaf:#7fc27b; --hay:#f0bf4c;
    --shadow:0 1px 0 rgba(0,0,0,.35), 0 12px 30px -16px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#101611; --paper:#19211b; --ink:#e5ece2; --ink-2:#9db0a1; --rule:#2c3a2f; --margin:#7d3d34;
  --barn:#e2654f; --barn-ink:#1b0e0a; --leaf:#7fc27b; --hay:#f0bf4c;
  --shadow:0 1px 0 rgba(0,0,0,.35), 0 12px 30px -16px rgba(0,0,0,.8);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--page);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit}
:focus-visible{outline:3px solid var(--hay);outline-offset:2px}

.app{max-width:1320px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:14px 32px;display:flex;flex-direction:column;gap:14px}

/* header */
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 18px}
.brand{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 14px;min-width:0}
.logo{margin:0;font-family:var(--font-display);font-weight:900;font-size:clamp(32px,4.4vw,46px);line-height:.9;letter-spacing:.02em;text-transform:uppercase;color:var(--ink)}
.logo span{color:var(--barn)}
.farmno{font-family:var(--font-type);font-size:13px;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.chip{display:flex;align-items:baseline;gap:7px;padding:6px 11px;border:1px solid var(--rule);border-radius:8px;background:var(--paper)}
.chip .k{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.chip .v{font-family:var(--font-type);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.chipbtn{padding:6px 11px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink);font-size:13px;font-weight:600;cursor:pointer}
.chipbtn[aria-pressed="false"]{color:var(--ink-2);text-decoration:line-through}

/* layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:980px){
  .layout{grid-template-columns:minmax(0,1fr) 380px;align-items:start}
  .ledger{position:sticky;top:calc(env(safe-area-inset-top, 0px) + 12px);max-height:calc(100vh - 24px);overflow:auto;padding-right:2px}
}

/* stage */
.stage{position:relative;height:clamp(390px,68vh,700px);border-radius:16px;overflow:hidden;background:var(--stage-bg);box-shadow:var(--shadow);isolation:isolate}
@media (max-width:640px){.stage{height:clamp(390px,64vh,560px);border-radius:12px}}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y}
.stage.playing canvas{cursor:none;touch-action:none}

.hud{position:absolute;inset:0;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px}
.pill{background:var(--hud-bg);color:var(--hud-fg);border-radius:10px;padding:7px 12px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.today{display:flex;align-items:baseline;gap:8px;font-family:var(--font-type);font-size:13px}
.today b{display:inline-block;font-size:22px;font-variant-numeric:tabular-nums}
.today.bump b{animation:bump .16s ease-out}
@keyframes bump{50%{transform:scale(1.13)}}
.combo{margin-top:8px;font-family:var(--font-display);font-weight:800;font-size:24px;letter-spacing:.04em;line-height:1;color:var(--hud-gold);text-shadow:0 2px 0 rgba(0,0,0,.4)}
.daylight{width:min(46%,300px)}
.dl-row{display:flex;justify-content:space-between;gap:8px;font-family:var(--font-type);font-size:13px;margin-bottom:6px;font-variant-numeric:tabular-nums}
.dl-track{height:9px;border-radius:6px;background:rgba(255,255,255,.18);overflow:hidden}
.dl-fill{height:100%;width:100%;transform-origin:left center;background:linear-gradient(90deg,var(--sun-a),var(--sun-b))}
.daylight.low .dl-fill{background:var(--hud-red)}
.daylight.low{animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{background:rgba(120,30,20,.7)}}

.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:16px;pointer-events:none}
.card{pointer-events:auto;width:min(440px,100%);background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-radius:14px;padding:18px 20px 16px;box-shadow:0 22px 60px -24px rgba(0,0,0,.65)}
.eyebrow{margin:0 0 6px;font-family:var(--font-type);font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.ctitle{margin:0 0 10px;font-family:var(--font-display);font-weight:800;font-size:clamp(27px,3.2vw,34px);line-height:1;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.cbody{margin:0 0 14px;line-height:1.5}
.cact{display:flex;gap:10px;flex-wrap:wrap}
.cfoot{margin:12px 0 0;font-size:12.5px;color:var(--ink-2)}

.toast{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom, 0px));transform:translate(-50%,8px);max-width:calc(100% - 32px);background:var(--hud-bg);color:var(--hud-fg);padding:8px 14px;border-radius:999px;font-size:14px;font-weight:600;text-align:center;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* buttons */
.btn{appearance:none;border:0;border-radius:10px;padding:11px 18px 9px;font-family:var(--font-display);font-weight:800;font-size:21px;line-height:1;letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:var(--paper);cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn.money{background:var(--barn);color:var(--barn-ink)}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.42;cursor:not-allowed;filter:none;transform:none}

/* ledger column */
.ledger{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:14px 14px 10px;min-width:0}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:4px}
.ph h2{margin:0;font-family:var(--font-display);font-weight:800;font-size:23px;line-height:1.05;letter-spacing:.05em;text-transform:uppercase}
.tag{font-family:var(--font-type);font-size:12px;color:var(--ink-2);white-space:nowrap}
.tag.closed{color:var(--barn);font-weight:700}
.hint{margin:0 0 6px;font-size:13px;color:var(--ink-2)}

/* the bank's notice, on ledger paper */
.notice{position:relative;padding:12px 16px 14px 46px;border:1px solid var(--rule);border-radius:4px 12px 12px 4px;background-color:var(--paper);background-image:linear-gradient(90deg,transparent 31px,var(--margin) 31px,var(--margin) 32px,transparent 32px),repeating-linear-gradient(180deg,transparent 0 25px,var(--rule) 25px 26px);font-family:var(--font-type);line-height:26px;box-shadow:var(--shadow);min-width:0}
.n-lh{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.n-lh strong{color:var(--ink)}
.n-name{font-size:19px;font-weight:700}
.n-note{margin:0;font-size:14px;color:var(--ink-2)}
.n-amtrow{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:0 10px}
.n-amt{font-size:40px;line-height:52px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.n-amt small{font-size:18px;color:var(--ink-2)}
.n-due{font-size:14px}
.n-due.hot{color:var(--barn);font-weight:700}
.meter{height:26px;display:flex;align-items:center}
.meter span{flex:1;height:8px;border-radius:5px;background:var(--rule);overflow:hidden}
.meter i{display:block;height:100%;background:var(--hay);border-radius:inherit}
.meter.full i{background:var(--leaf)}
.n-cash{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-variant-numeric:tabular-nums}
.n-proj{margin:0;font-size:13px}
.n-proj.ok{color:var(--leaf)}
.n-proj.bad{color:var(--barn)}
.n-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px}
.n-next{font-size:12px;color:var(--ink-2);line-height:1.4}
.stamp{display:inline-block;transform:rotate(-8deg);padding:3px 8px 1px;border:3px solid currentColor;border-radius:6px;font-family:var(--font-display);font-weight:900;font-size:19px;line-height:1.15;letter-spacing:.08em;text-transform:uppercase;color:var(--barn);opacity:.9;white-space:nowrap;-webkit-mask-image:repeating-linear-gradient(115deg,#000 0 3px,rgba(0,0,0,.7) 3px 4px);mask-image:repeating-linear-gradient(115deg,#000 0 3px,rgba(0,0,0,.7) 3px 4px)}
.stamp.muted{color:var(--ink-2);opacity:.6}
.stamp.ok{color:var(--leaf)}
.stamp.pop{animation:stampIn .32s cubic-bezier(.2,1.5,.4,1) both}
@keyframes stampIn{from{transform:rotate(-8deg) scale(2.1);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:.9}}

/* shed and heirloom rows */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:1px 12px;padding:9px 0;border-top:1px dashed var(--rule)}
.row:first-child{border-top:0}
.r-name{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;font-weight:600}
.r-fx{grid-column:1;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.r-btn{grid-column:2;grid-row:1 / span 2}
.pips{display:inline-flex;gap:2px}
.pips i{width:6px;height:6px;border-radius:1.5px;background:var(--rule)}
.pips i.on{background:var(--leaf)}
.buy{min-width:94px;padding:8px 10px;border:1.5px solid var(--ink);border-radius:8px;background:transparent;color:var(--ink);font-family:var(--font-type);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;cursor:pointer}
.buy.can{background:var(--ink);color:var(--paper)}
.buy:disabled{opacity:.5;border-style:dashed;cursor:not-allowed}
.buy.max{border-color:transparent;opacity:.7}

.perks{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:4px}
.perk{padding:5px 10px;border:1px solid var(--rule);border-radius:999px;background:var(--page);font-size:13px;font-weight:600}
.perk small{color:var(--ink-2);font-weight:500}
.empty{margin:0 0 6px;font-size:13.5px;color:var(--ink-2)}

.foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 12px;padding:0 4px;font-size:12.5px;color:var(--ink-2)}
.foot p{margin:0}
.linkbtn{padding:0;border:0;background:none;color:var(--ink-2);text-decoration:underline;cursor:pointer;font-size:12.5px}

/* modal */
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));background:var(--scrim)}
.sheet{position:relative;width:min(580px,100%);max-height:100%;overflow:auto;background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-radius:14px;padding:22px 22px 18px;box-shadow:0 30px 80px -30px rgba(0,0,0,.7)}
.mtop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.mtitle{margin:4px 0 12px;font-family:var(--font-display);font-weight:800;font-size:31px;line-height:1;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.perkgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:6px}
.perkcard{display:flex;flex-direction:column;gap:6px;padding:14px;border:1.5px solid var(--ink);border-radius:12px;background:var(--page);color:var(--ink);text-align:left;cursor:pointer}
.perkcard:hover{background:var(--ink);color:var(--paper)}
.perkcard .pn{font-family:var(--font-display);font-weight:800;font-size:21px;line-height:1;text-transform:uppercase;letter-spacing:.03em}
.perkcard .pl{font-size:14px;line-height:1.35}
.unlock{margin:14px 0 0;padding:10px 12px;border:1px dashed var(--rule);border-radius:10px;font-size:14px}
.letter{font-family:var(--font-type);font-size:15px;line-height:1.55}
.letter p{margin:0 0 10px}
.letter .sig{font-style:italic}
.tally{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0 10px}
.tally div{padding:8px 10px;border:1px solid var(--rule);border-radius:10px;min-width:0}
.tally dt{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.tally dd{margin:2px 0 0;font-family:var(--font-type);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
@media (max-width:480px){.tally{grid-template-columns:1fr}}
.gritline{margin:0;font-size:14px}
.gritline span{color:var(--ink-2)}
.mact{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:10px;margin-top:16px}

@media (prefers-reduced-motion: reduce){
  .stamp.pop,.today.bump b,.daylight.low{animation:none}
  .toast{transition:none}
}
</style>
</head>
<body>

<div class="app">
  <header class="bar">
    <div class="brand">
      <h1 class="logo">Due by <span>Dusk</span></h1>
      <span class="farmno" id="hFarm">Farm No. 1</span>
    </div>
    <div class="chips">
      <div class="chip"><span class="k">Day</span><span class="v" id="hDay">1</span></div>
      <div class="chip"><span class="k">Cash</span><span class="v" id="hCash">$0</span></div>
      <div class="chip"><span class="k">Grit</span><span class="v" id="hGrit">0</span></div>
      <button class="chipbtn" id="btnSound" type="button" aria-pressed="true">Sound</button>
    </div>
  </header>

  <main class="layout">
    <section class="stage" id="stage" aria-label="The field">
      <canvas id="field" role="img" aria-label="Your field. Move the scythe over the crops to harvest them before sunset."></canvas>
      <div class="hud" id="hud" hidden>
        <div>
          <div class="pill today" id="hudToday">Today <b id="hudEarn">$0</b></div>
          <div class="combo" id="hudCombo"></div>
        </div>
        <div class="pill daylight" id="hudLight">
          <div class="dl-row"><span>Daylight</span><span id="dlText">12.0 s</span></div>
          <div class="dl-track"><div class="dl-fill" id="dlFill"></div></div>
        </div>
      </div>
      <div class="overlay" id="overlay"></div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </section>

    <aside class="ledger" aria-label="Farm ledger">
      <article class="notice" id="notice" aria-live="polite"></article>

      <section class="panel" aria-labelledby="shedH">
        <div class="ph"><h2 id="shedH">Equipment shed</h2><span class="tag" id="shedTag">Open</span></div>
        <p class="hint" id="shedHint">Upgrades last until the bank takes this farm.</p>
        <div class="rows" id="shedList"></div>
      </section>

      <section class="panel" aria-labelledby="perkH">
        <div class="ph"><h2 id="perkH">Perks</h2><span class="tag">This farm only</span></div>
        <div id="perkList"></div>
      </section>

      <section class="panel" aria-labelledby="heirH">
        <div class="ph"><h2 id="heirH">Heirlooms</h2><span class="tag" id="gritTag">0 Grit</span></div>
        <p class="hint" id="heirHint"></p>
        <div class="rows" id="heirList"></div>
      </section>

      <footer class="foot">
        <p>Mouse, finger or arrow keys. Progress saves in this browser.</p>
        <button type="button" class="linkbtn" id="btnReset">Wipe save</button>
      </footer>
    </aside>
  </main>
</div>
<div class="modal" id="modal" hidden></div>

<script>
(() => {
'use strict';

/* ================= data ================= */
const HW = 640, HORIZON = 186, FIELD_TOP = 228, PAD = 30;

const CROP = {
  carrot:  { name:'Carrot',         hp:1,  val:1,  r:17, top:40, color:'#ff9a3c' },
  cabbage: { name:'Cabbage',        hp:3,  val:3,  r:23, top:34, color:'#9ad672' },
  pumpkin: { name:'Pumpkin',        hp:10, val:9,  r:32, top:48, color:'#ff9f35' },
  radish:  { name:'Runaway radish', hp:2,  val:6,  r:17, top:38, color:'#ff4d6d' },
  golden:  { name:'Golden corn',    hp:3,  val:30, r:20, top:40, color:'#ffd84a' },
  potato:  { name:'Couch potato',   hp:28, val:22, r:34, top:56, color:'#d9a86c' },
};

const BILLS = [
  { name:'Seed loan',             amt:20,    days:3, note:'For the carrot seeds. We trust you. Mostly.' },
  { name:'New fence',             amt:60,    days:4, note:'Your goat ate the old one. The goat denies this.' },
  { name:'Tractor transmission',  amt:180,   days:4, note:'It only drives in reverse now. Charming, but no.' },
  { name:'Pond water rights',     amt:500,   days:4, note:'The ducks have retained counsel.' },
  { name:'Barn roof',             amt:1300,  days:4, note:'The pigeons have filed a formal complaint.' },
  { name:"Grandma's pie insurance", amt:3200, days:5, note:'Required by the county fair. Do not ask why.' },
  { name:'Property tax',          amt:8500,  days:5, note:'The county noticed you are doing well.' },
  { name:"The scarecrow's lawyer", amt:30000, days:6, note:'He is suing for back pay. He has a point.' },
  { name:'The deed',              amt:90000, days:7, note:'Pay this and the farm is yours. Forever. Probably.' },
];

const UNLOCKS = {
  1: 'Cabbages. A few hits each, they sell for $3.',
  2: 'Pumpkins, worth $9. Also a goat. Do not swing at the goat.',
  3: 'Runaway radishes. They see you coming, so corner them.',
  4: 'Golden corn. Rare, sparkly, worth $30.',
  5: 'Couch potatoes. Heavy sleepers, worth $22 each.',
};

const SHED = [
  { id:'scythe', name:'Sharper scythe',  base:8,  g:2.0, max:12, show:s => `${s.dmg} damage` },
  { id:'swing',  name:'Wider swing',     base:12, g:2.1, max:8,  show:s => `size ${Math.round(s.R)}` },
  { id:'hands',  name:'Quicker hands',   base:14, g:2.1, max:8,  show:s => `${s.tick.toFixed(1)} swings/s` },
  { id:'days',   name:'Longer days',     base:18, g:2.2, max:8,  show:s => `${trim1(s.day)} s of light` },
  { id:'soil',   name:'Richer soil',     base:16, g:2.1, max:8,  show:s => `${s.max} crops at once` },
  { id:'market', name:"Farmers' market", base:25, g:2.0, max:10, show:s => `prices ×${s.vm.toFixed(2)}` },
  { id:'clover', name:'Lucky clover',    base:30, g:2.3, max:6,  show:s => `${Math.round(s.cc*100)}% crit chance` },
];

const ALMANAC = [0, 30, 120, 400, 1200, 3500];
const HEIRS = [
  { id:'boots',     name:"Grandpa's boots",        base:4, g:2.1, max:8, line:() => '+1 s of daylight per level' },
  { id:'calloused', name:'Calloused hands',        base:5, g:2.1, max:8, line:() => '+1 damage per level' },
  { id:'hat',       name:'Big straw hat',          base:4, g:2.2, max:6, line:() => 'Swing 8% wider per level' },
  { id:'almanac',   name:"Farmer's almanac",       base:3, g:2.4, max:5, line:l => l >= 5 ? `Every farm starts with ${fmt$(ALMANAC[5])}` : `Start each farm with ${fmt$(ALMANAC[l+1])}` },

function newFarm(){
  return { no: meta.lost + meta.owned + 1, day:1, cash: ALMANAC[meta.heir.almanac] || 0, shed: blank(SHED_IDS), perks: [],
    bill:0, due: BILLS[0].days, paidTotal:0, billsPaid:0, lastEarn:0, lastCount:0, played:false, earned:0, harvested:0, pendingPerks:null };
}

function stats(shed){
  shed = shed || farm.shed;
  const H = meta.heir, P = farm.perks;
  return {
    dmg: 1 + shed.scythe + H.calloused + 2 * count(P, 'spite'),
    tick: 4 + 0.6 * shed.hands + 0.5 * H.rooster + count(P, 'coffee'),
    R: 46 * (1 + 0.14 * shed.swing) * (1 + 0.08 * H.hat) * (1 + 0.2 * count(P, 'elbow')),
    day: 12 + 1.5 * shed.days + H.boots + 2 * count(P, 'saving'),
    max: 10 + 3 * shed.soil + 4 * count(P, 'hungry'),
    spawn: 0.45 / (1 + 0.25 * shed.soil),
    vm: (1 + 0.15 * shed.market) * (1 + 0.3 * count(P, 'fever')),
    cc: Math.min(0.6, 0.05 + 0.04 * shed.clover + 0.03 * H.horseshoe + 0.08 * count(P, 'clover')),
    cm: count(P, 'heavy') ? 5 : 3,
    gold: 0.02 + 0.012 * shed.clover + 0.015 * H.horseshoe + 0.04 * count(P, 'gold'),
    comboCap: count(P, 'combo') ? 0.8 : 0.4,
    radishSlow: count(P, 'whisper') ? 0.5 : 1,

}
function statsWith(id){ const sh = Object.assign({}, farm.shed); sh[id] += 1; return stats(sh); }
function shedCost(def, lvl){ return lvl >= def.max ? null : Math.round(def.base * Math.pow(def.g, lvl) * (1 - 0.05 * meta.heir.cousin)); }

function hpMul(){ return 1 + 0.08 * (farm.day - 1); }
function billStatus(){ const left = farm.due - (farm.day - 1); return { left, tonight: left <= 0, b: BILLS[farm.bill] }; }
function gritFor(f){ const a = Math.floor(f.paidTotal / 25), b = 2 * f.billsPaid, c = f.day - 1; return { a, b, c, total: a + b + c }; }

/* save */
const SAVE_KEY = 'due-by-dusk-v1';

function loadRaw(){ try { const s = localStorage.getItem(SAVE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function sanitize(d){
  if (!d || typeof d !== 'object' || !d.meta || !d.farm) return null;
  const num = (v, def = 0) => (typeof v === 'number' && isFinite(v)) ? v : def;
  const m = { grit: num(d.meta.grit), heir: blank(HEIR_IDS), lost: num(d.meta.lost), owned: num(d.meta.owned), best: num(d.meta.best), sound: d.meta.sound !== false };
  HEIRS.forEach(h => m.heir[h.id] = clamp(Math.floor(num(d.meta.heir && d.meta.heir[h.id])), 0, h.max));
  const f = d.farm, nf = { no: Math.max(1, num(f.no, 1)), day: Math.max(1, Math.floor(num(f.day, 1))), cash: Math.max(0, num(f.cash)), shed: blank(SHED_IDS),
    perks: Array.isArray(f.perks) ? f.perks.filter(p => PERKS.some(x => x.id === p)) : [], bill: clamp(Math.floor(num(f.bill)), 0, BILLS.length - 1),
    due: num(f.due, BILLS[0].days), paidTotal: num(f.paidTotal), billsPaid: clamp(Math.floor(num(f.billsPaid)), 0, BILLS.length), lastEarn: num(f.lastEarn), lastCount: num(f.lastCount),
    played: !!f.played, earned: num(f.earned), harvested: num(f.harvested), pendingPerks: Array.isArray(f.pendingPerks) ? f.pendingPerks.filter(p => PERKS.some(x => x.id === p)) : null };
  SHED.forEach(s => nf.shed[s.id] = clamp(Math.floor(num(f.shed && f.shed[s.id])), 0, s.max));
  if (nf.pendingPerks && !nf.pendingPerks.length) nf.pendingPerks = null;

/* ================= runtime ================= */
let mode = 'idle';           // idle | day | dusk
let cur = null, time = 0, dayLen = 12, tNow = 0;
let crops = [], parts = [], texts = [], goat = null, goatTimer = Infinity;
let tickAcc = 0, spawnAcc = 0, sweepT = 0, sweepA = 0, shakeA = 0, duskT = 0, dawnFade = 0, lastSec = 99;
let combo = 0, comboTimer = 0, today = { earned:0, count:0 }, coinTarget = null, lastBump = 0;
const pointer = { x:0, y:0, active:false, down:false, placed:false, kind:'mouse' };
const keys = new Set();

function depth(y){ return 0.8 + 0.45 * clamp((y - FIELD_TOP) / (HW - FIELD_TOP), 0, 1); }
function pickType(){
  const paid = farm.billsPaid;
  if (paid >= 4 && Math.random() < cur.gold) return 'golden';
  const w = [['carrot', Math.max(12, 50 - 8 * paid)]];
  if (paid >= 1) w.push(['cabbage', 30]); if (paid >= 2) w.push(['pumpkin', 16]); if (paid >= 3) w.push(['radish', 10]); if (paid >= 5) w.push(['potato', 8]);
  let r = Math.random() * w.reduce((a, b) => a + b[1], 0);
  for (const [k, v] of w){ r -= v; if (r <= 0) return k; }

}
function spawnCrop(delay){

    x = PAD + Math.random() * (worldW - PAD * 2); y = FIELD_TOP + 32 + Math.random() * (HW - FIELD_TOP - 54);
    const rr = def.r * depth(y);
    ok = crops.every(c => { const dx = c.x - x, dy = c.y - y, m = (c.r * c.ds + rr) * 0.95; return dx * dx + dy * dy > m * m; });
  }
  if (!ok) return false;
  const hp = def.hp * hpMul();
  crops.push({ type, x, y, ds: depth(y), r: def.r, hp, maxHp: hp, age: -(delay || 0), sq:0, flash:0, wob: Math.random() * 6.28, vx:0, vy:0, hpShow:0, panic:0, stam:1, zt: Math.random() * 2, eye:0, dead:false });

}
function fillIdle(){ crops = []; for (let i = 0; i < cur.max; i++) spawnCrop(0); crops.forEach(c => c.age = 1); }

function startDay(){
  Sound.init();
  cur = stats(); dayLen = cur.day; time = dayLen; lastSec = 99;
  crops = []; parts = []; texts = []; spawnAcc = 0; tickAcc = 0; combo = 0; comboTimer = 0;
  today = { earned:0, count:0 };
  goatTimer = farm.billsPaid >= 2 ? 3 + Math.random() * 5 : Infinity; goat = null;
  for (let i = 0; i < cur.max; i++) spawnCrop(0.12 + i * 0.03);
  mode = 'day'; dawnFade = reduceMotion ? 0 : 0.85;

}

  mode = 'dusk'; duskT = 0;

  stage.classList.remove('playing'); keys.clear();

}

function swing(){
  if (!pointer.active) return;
  sweepT = 0.13; sweepA = (sweepA + 2.3) % (Math.PI * 2);

  let hits = 0, killed = 0;
  for (const c of crops){
    if (c.dead || c.age < 0.05) continue;
    const cy = c.y - c.r * c.ds * 0.45, dx = c.x - pointer.x, dy = cy - pointer.y, rr = cur.R + c.r * c.ds * 0.6;
    if (dx * dx + dy * dy > rr * rr) continue;

  }
  if (hits){ Sound.hit(crit); if (crit){ shake(5); addText('CRIT', pointer.x, pointer.y - cur.R - 8, '#ffd34d', 30, -40, 0.7); } }
  if (killed) crops = crops.filter(c => !c.dead);

}

}

/* the goat */
function spawnGoat(){

/* ================= update ================= */
function moveRadish(c, dt){
  const dx = c.x - pointer.x, dy = c.y - pointer.y, d = Math.hypot(dx, dy) || 1;
  if (pointer.active && d < cur.R + 120){ c.vx += dx / d * 1100 * dt; c.vy += dy / d * 1100 * dt; c.panic = 1; c.stam = Math.max(0.35, c.stam - dt * 0.28); }
  else { c.panic = Math.max(0, c.panic - dt * 1.5); c.stam = Math.min(1, c.stam + dt * 0.2); }
  const k = Math.exp(-5 * dt); c.vx *= k; c.vy *= k;
  const maxV = 190 * cur.radishSlow * c.stam, v = Math.hypot(c.vx, c.vy);
  if (v > maxV){ c.vx *= maxV / v; c.vy *= maxV / v; }
  c.x += c.vx * dt; c.y += c.vy * dt;
  if (c.x < PAD){ c.x = PAD; c.vx = Math.abs(c.vx) * 0.3; }
  if (c.x > worldW - PAD){ c.x = worldW - PAD; c.vx = -Math.abs(c.vx) * 0.3; }
  if (c.y < FIELD_TOP + 30){ c.y = FIELD_TOP + 30; c.vy = Math.abs(c.vy) * 0.3; }
  if (c.y > HW - 22){ c.y = HW - 22; c.vy = -Math.abs(c.vy) * 0.3; }
  c.ds = depth(c.y);
  if (v > 60 && Math.random() < dt * 14 && canAdd()) parts.push({ k:'dust', x:c.x, y:c.y + 2, vx:-c.vx * 0.1, vy:-10, g:0, s:3 + Math.random() * 3, life:0.4, max:0.4 });
}
function update(dt){
  tNow += dt;
  if (mode === 'day'){
    time -= dt;
    if (keys.size){
      let vx = 0, vy = 0;
      if (keys.has('arrowleft') || keys.has('a')) vx -= 1; if (keys.has('arrowright') || keys.has('d')) vx += 1;
      if (keys.has('arrowup') || keys.has('w')) vy -= 1; if (keys.has('arrowdown') || keys.has('s')) vy += 1;
      if (vx || vy){ const l = Math.hypot(vx, vy); pointer.x = clamp(pointer.x + vx / l * 520 * dt, 0, worldW); pointer.y = clamp(pointer.y + vy / l * 520 * dt, FIELD_TOP - 20, HW); pointer.active = true; }
    }
    comboTimer -= dt; if (comboTimer <= 0 && combo){ combo = 0; }
    tickAcc += dt; const iv = 1 / cur.tick; while (tickAcc >= iv){ tickAcc -= iv; swing(); }
    spawnAcc += dt;
    if (spawnAcc >= cur.spawn){ if (crops.length < cur.max){ spawnCrop(0); spawnAcc -= cur.spawn; } else spawnAcc = cur.spawn; }
    if (!goat){ goatTimer -= dt; if (goatTimer <= 0 && farm.billsPaid >= 2) spawnGoat(); }
    const sec = Math.ceil(time);
    if (time < 3.2 && sec !== lastSec && sec > 0){ lastSec = sec; Sound.tick(); }
    if (time <= 0){ time = 0; endDay(); }
  } else if (mode === 'dusk'){
    duskT += dt; if (duskT >= 1.3){ mode = 'idle'; renderAll(); }
  }
  if (goat){ goat.t += dt; goat.x += goat.dir * goat.speed * dt; if (goat.x < -90 || goat.x > worldW + 90){ goat = null; goatTimer = 7 + Math.random() * 7; } }
  for (const c of crops){
    c.age += dt; c.sq = Math.max(0, c.sq - dt * 6); c.flash = Math.max(0, c.flash - dt * 7); c.hpShow = Math.max(0, c.hpShow - dt); c.eye = Math.max(0, c.eye - dt);
    if (c.type === 'radish' && mode === 'day') moveRadish(c, dt); else if (c.type === 'radish'){ c.vx *= 0.9; c.vy *= 0.9; c.panic = Math.max(0, c.panic - dt); }
    if (c.type === 'potato' && c.age > 0){ c.zt -= dt; if (c.zt <= 0){ c.zt = 1.3 + Math.random(); addText('z', c.x + 10 * c.ds, c.y - 50 * c.ds, '#efeaff', 16, -16, 1.6); } }
    if (c.type === 'golden' && c.age > 0 && Math.random() < dt * 3) spark(c.x + (Math.random() - 0.5) * 30 * c.ds, c.y - (14 + Math.random() * 30) * c.ds);

}

}

    `<div class="letter"><p class="eyebrow">Grumble &amp; Sons Savings &amp; Loan</p>` +
    `<h3 class="mtitle" id="mTitle">The bank took the farm.</h3>` +
    `<p>Dear farmer,</p><p>Regarding your ${lc(b.name)}: you were ${fmt$(short)} short. The farm, the tractor and the goat now belong to us. The goat is already a problem.</p>` +
    `<p>You keep your heirlooms and your Grit.</p><p class="sig">A. Grumble, Junior Loan Officer</p></div>` +
    `<dl class="tally"><div><dt>Days survived</dt><dd>${old.day - 1}</dd></div><div><dt>Bills paid</dt><dd>${old.billsPaid} of ${BILLS.length}</dd></div><div><dt>Paid to the bank</dt><dd>${fmt$(old.paidTotal)}</dd></div></dl>` +
    `<p class="gritline">Grit earned: <b>${g.total}</b> <span>(${g.a} from payments, ${g.b} for bills, ${g.c} for days)</span></p>` +
    `<div class="mact"><button class="btn" type="button" data-close>Start farm No. ${farm.no}</button></div>`
  );
}
function win(){
  const old = farm, g = gritFor(old), bonus = 25;
  meta.grit += g.total + bonus; meta.owned += 1; meta.best = BILLS.length;
  farm = newFarm(); cur = stats(); mode = 'idle'; goat = null; fillIdle(); lastStampKey = '';
  save(); renderAll(); Sound.fanfare();
  openModal(
    `<div class="letter"><div class="mtop"><p class="eyebrow">Grumble &amp; Sons Savings &amp; Loan</p><span class="stamp ok pop">Paid in full</span></div>` +
    `<h3 class="mtitle" id="mTitle">The farm is yours.</h3>` +
    `<p>Dear former customer,</p><p>Enclosed is the deed. We are, frankly, upset. The scarecrow sends his regards and has withdrawn his lawsuit.</p><p class="sig">A. Grumble, Junior Loan Officer</p></div>` +
    `<dl class="tally"><div><dt>Days</dt><dd>${old.day - 1}</dd></div><div><dt>Crops cut</dt><dd>${old.harvested.toLocaleString('en-US')}</dd></div><div><dt>Earned</dt><dd>${fmt$(old.earned)}</dd></div></dl>` +
    `<p class="gritline">Grit earned: <b>${g.total + bonus}</b> <span>(including ${bonus} for owning the farm outright)</span></p>` +
    `<div class="mact"><button class="btn" type="button" data-close>Buy another run-down farm</button></div>`
  );
}
function askWipe(){
  openModal(
    `<h3 class="mtitle" id="mTitle">Wipe your save?</h3><p>This deletes your farm, your Grit and every heirloom in this browser. It can't be undone.</p>` +
    `<div class="mact"><button class="btn" type="button" data-close>Keep my save</button><button class="btn money" type="button" data-wipe>Wipe everything</button></div>`
  );
}
function wipe(){
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  meta = { grit:0, heir:blank(HEIR_IDS), lost:0, owned:0, best:0, sound:meta.sound };
  farm = newFarm(); cur = stats(); mode = 'idle'; goat = null; fillIdle(); lastStampKey = '';
  closeModal(); save(); renderAll(); toast('Save wiped. Fresh farm.');
}

let lastFocus = null;
function openModal(html){
  lastFocus = document.activeElement;
  el.modal.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">${html}</div>`;
  el.modal.hidden = false; renderCard();
  const b = el.modal.querySelector('button'); if (b) b.focus();
}
function closeModal(){
  el.modal.hidden = true; el.modal.innerHTML = ''; renderCard();
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
}

/* events */
el.overlay.addEventListener('click', e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const act = b.dataset.act; Sound.init(); Sound.click();
  if (act === 'start') startDay(); else if (act === 'pay') payBill(); else if (act === 'bank') foreclose();
});
el.notice.addEventListener('click', e => { if (e.target.closest('#btnPay')) payBill(); });
el.shedList.addEventListener('click', e => { const b = e.target.closest('button[data-buy]'); if (b) buyShed(b.dataset.buy); });
el.heirList.addEventListener('click', e => { const b = e.target.closest('button[data-heir]'); if (b) buyHeir(b.dataset.heir); });
el.modal.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.perk) choosePerk(b.dataset.perk);
  else if (b.dataset.wipe !== undefined) wipe();
  else if (b.dataset.close !== undefined){ Sound.click(); closeModal(); }
});
el.modal.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !farm.pendingPerks){ closeModal(); return; }
  if (e.key !== 'Tab') return;
  const f = [...el.modal.querySelectorAll('button')]; if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first){ last.focus(); e.preventDefault(); }
  else if (!e.shiftKey && document.activeElement === last){ first.focus(); e.preventDefault(); }
});
el.btnSound.addEventListener('click', () => { meta.sound = !meta.sound; Sound.on = meta.sound; if (meta.sound){ Sound.init(); Sound.click(); } save(); renderHeader(); });
el.btnReset.addEventListener('click', askWipe);

function toWorld(e){
  const r = canvas.getBoundingClientRect();
  return [(e.clientX - r.left) / scale, (e.clientY - r.top) / scale - (e.pointerType === 'touch' ? 40 / scale : 0)];
}
canvas.addEventListener('pointermove', e => {
  const [x, y] = toWorld(e); pointer.x = x; pointer.y = y; pointer.placed = true;
  if (e.pointerType === 'mouse'){ pointer.active = true; pointer.kind = 'mouse'; } else if (pointer.down) pointer.active = true;
});
canvas.addEventListener('pointerdown', e => {
  const [x, y] = toWorld(e); pointer.x = x; pointer.y = y; pointer.placed = true; pointer.down = true; pointer.active = true; pointer.kind = e.pointerType;
  if (e.pointerType !== 'mouse' && mode === 'day'){ try { canvas.setPointerCapture(e.pointerId); } catch (err) {} }
});
const pUp = e => { pointer.down = false; if (e.pointerType !== 'mouse') pointer.active = false; };
canvas.addEventListener('pointerup', pUp); canvas.addEventListener('pointercancel', pUp);
canvas.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') pointer.active = false; });
const MOVE_KEYS = ['arrowleft', 'arrowright', 'arrowup', 'arrowdown', 'a', 'd', 'w', 's'];
addEventListener('keydown', e => {
  if (mode !== 'day') return;
  const k = e.key.toLowerCase(); if (!MOVE_KEYS.includes(k)) return;
  e.preventDefault(); keys.add(k);
  if (!pointer.placed || pointer.kind !== 'key'){ pointer.kind = 'key'; if (!pointer.placed){ pointer.x = worldW / 2; pointer.y = (FIELD_TOP + HW) / 2; pointer.placed = true; } }
});
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => keys.clear());

/* loop */
let last = 0;
function frame(now){
  const dt = last ? Math.min(0.05, (now - last) / 1000) : 0; last = now;
  update(dt); draw(); updateHud();
  requestAnimationFrame(frame);
}

function start(hot){
  const saved = sanitize(hot && hot.save) || sanitize(loadRaw());
  if (saved){ meta = saved.meta; farm = saved.farm; } else farm = newFarm();
  Sound.on = meta.sound;
  cur = stats(); buildSprites(); resize();
  if ('ResizeObserver' in window) new ResizeObserver(() => resize()).observe(stage); else addEventListener('resize', resize);
  fillIdle(); renderAll();
  if (farm.pendingPerks) openPerkModal();
  if (document.fonts && document.fonts.load) document.fonts.load('800 24px "Big Shoulders Stencil"').catch(() => {});
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ save: { meta, farm } }));
  requestAnimationFrame(frame);
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>

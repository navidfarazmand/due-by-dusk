name: Mobile game checks

on:
  push:
    # branches only: a play-v* tag builds the Play bundle instead (release-aab.yml)
    branches: ['**']
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Test save recovery and game rules
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run landscape browser smoke tests
        run: npm run test:e2e
      - name: Build production assets
        run: npm run build
      - name: Sync native Android plugins and assets
        run: npx cap sync android
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            mobile/android/**/*.gradle
            mobile/android/gradle/wrapper/gradle-wrapper.properties
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Compile debug Android app
        run: bash android/gradlew -p android --no-daemon assembleDebug
      - name: Save debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: due-by-dusk-debug-${{ github.run_number }}
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish Android testing prerelease
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="android-v${version}"
          cp android/app/build/outputs/apk/debug/app-debug.apk Due-by-Dusk-Test.apk
          cat > "$RUNNER_TEMP/android-test-release-notes.md" <<EOF
          Android testing build v${version}. Source commit: ${GITHUB_SHA}.

          Download **Due-by-Dusk-Test.apk** below, then open it on your Android phone to install.

          This installs **Due by Dusk Test** alongside the old Due by Dusk app and preserves the old app's data. Keep the old app installed. To carry over progress, export your save from the old app's Management panel and import that JSON in Due by Dusk Test. The test app initially has separate, empty storage. Future test APKs update Due by Dusk Test in place.

          Development build only, signed with an intentionally public testing key. This is not a Google Play production release.
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" Due-by-Dusk-Test.apk --clobber
            gh release edit "$tag" --prerelease --notes-file "$RUNNER_TEMP/android-test-release-notes.md"
          else
            gh release create "$tag" Due-by-Dusk-Test.apk --prerelease --target "$GITHUB_SHA" --title "Android test v${version}" --notes-file "$RUNNER_TEMP/android-test-release-notes.md"
          fi
      - name: Save browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-test-diagnostics-${{ github.run_number }}
          path: |
            mobile/playwright-report/
            mobile/test-results/
          if-no-files-found: ignore
          retention-days: 7

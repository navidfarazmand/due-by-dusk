name: Play release bundle

# Builds a signed Android App Bundle (.aab) for Google Play (app ID com.khoreh.duebydusk).
# Run it from GitHub: Actions > Play release bundle > Run workflow, or push a tag: play-v0.10.0 builds with Google's
# demo ads (closed testing), play-prod-v0.10.0 with real ads (production, once the listing is live and linked in
# AdMob). Download the bundle from the run's artifacts and upload it in Play Console.
#
# Needs four repository secrets (Settings > Secrets and variables > Actions), made from your private upload key:
#   DBD_UPLOAD_KEYSTORE_BASE64  the upload keystore file, base64-encoded
#   DBD_UPLOAD_STORE_PASSWORD   the keystore password
#   DBD_UPLOAD_KEY_ALIAS        the key alias (for example "upload")
#   DBD_UPLOAD_KEY_PASSWORD     the key password
# See mobile/docs/release-plan.md for how to create the key.
#
# Optional, to send the bundle to Play Console by itself: a Google Cloud service account invited in Play Console with
# "Release apps to testing tracks", reached either keylessly (repository variables GCP_WIF_PROVIDER and
# GCP_SERVICE_ACCOUNT, Workload Identity Federation; the way for new Google Cloud accounts, which block key files) or
# with a JSON key in the secret PLAY_SERVICE_ACCOUNT_JSON. With either, a play-v* tag
# rolls the bundle out to closed testing (the "alpha" track); a play-prod-v* tag puts it in production as a draft to
# review and roll out by hand; a manual run does what its "upload" box says. Without it, the bundle is only saved here.

on:
  workflow_dispatch:
    inputs:
      production_ads:
        description: 'Request real AdMob ads. Leave off for closed testing (shows Google demo ads).'
        type: boolean
        default: false
      upload:
        description: 'Send the bundle to Play Console (needs the Google Cloud access in docs/release-plan.md).'
        type: choice
        options: ['no', 'closed testing (roll out)', 'closed testing (draft)', 'production (draft)']
        default: 'no'
  push:
    tags: ['play-v*', 'play-prod-v*']

permissions:
  contents: read
  # Workload Identity Federation: GitHub vouches for this run to Google Cloud, no key file needed
  id-token: write

concurrency:
  group: play-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check that the upload key secrets exist
        env:
          STORE: ${{ secrets.DBD_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.DBD_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DBD_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DBD_UPLOAD_KEY_PASSWORD }}
        working-directory: .
        run: |
          missing=""
          [ -n "$STORE" ] || missing="$missing DBD_UPLOAD_KEYSTORE_BASE64"
          [ -n "$STORE_PASSWORD" ] || missing="$missing DBD_UPLOAD_STORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing DBD_UPLOAD_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing DBD_UPLOAD_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Add these repository secrets before building a Play bundle:$missing"
            exit 1
          fi
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Test save recovery and game rules
        run: npm test
      - name: Build production assets
        env:
          VITE_ADMOB_PRODUCTION: ${{ (inputs.production_ads || startsWith(github.ref_name, 'play-prod-v')) && 'true' || 'false' }}
        run: npm run build
      - name: Sync native Android plugins and assets
        run: npx cap sync android
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            mobile/android/**/*.gradle
            mobile/android/gradle/wrapper/gradle-wrapper.properties
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Restore the upload key
        env:
          STORE: ${{ secrets.DBD_UPLOAD_KEYSTORE_BASE64 }}
        run: printf '%s' "$STORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
      - name: Build the signed release bundle
        env:
          DBD_UPLOAD_STORE_FILE: ${{ runner.temp }}/upload.jks
          DBD_UPLOAD_STORE_PASSWORD: ${{ secrets.DBD_UPLOAD_STORE_PASSWORD }}
          DBD_UPLOAD_KEY_ALIAS: ${{ secrets.DBD_UPLOAD_KEY_ALIAS }}
          DBD_UPLOAD_KEY_PASSWORD: ${{ secrets.DBD_UPLOAD_KEY_PASSWORD }}
        run: |
          # Play needs a higher versionCode on every upload; run numbers only go up. 1001 (0.11.0) was uploaded by
          # hand, so this workflow's codes start above it.
          export DBD_VERSION_CODE=$((1100 + GITHUB_RUN_NUMBER))
          echo "versionCode $DBD_VERSION_CODE, production ads: ${{ inputs.production_ads || startsWith(github.ref_name, 'play-prod-v') }}"
          bash android/gradlew -p android --no-daemon bundleRelease
      - name: Check the bundle is signed
        run: |
          aab=android/app/build/outputs/bundle/release/app-release.aab
          if ! keytool -printcert -jarfile "$aab" | tee "$RUNNER_TEMP/signer.txt" | grep -q 'SHA256:'; then
            echo "::error::The bundle is not signed with the upload key."
            exit 1
          fi
          grep -E 'Owner:|SHA256:' "$RUNNER_TEMP/signer.txt"
      - name: Save the bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: due-by-dusk-play-${{ github.run_number }}
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
      - name: Decide where the bundle goes in Play Console
        id: play
        env:
          HAS_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' || (vars.GCP_WIF_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '') }}
          CHOICE: ${{ inputs.upload || '' }}
          REF: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        working-directory: .
        run: |
          track=""; status=""
          if [ "$EVENT" = "push" ]; then
            case "$REF" in
              play-prod-v*) track=production; status=draft ;;
              play-v*) track=alpha; status=completed ;;
            esac
          else
            case "$CHOICE" in
              'closed testing (roll out)') track=alpha; status=completed ;;
              'closed testing (draft)') track=alpha; status=draft ;;
              'production (draft)') track=production; status=draft ;;
            esac
          fi
          if [ -n "$track" ] && [ "$HAS_KEY" != "true" ]; then
            echo "::warning::Not sent to Play Console: set up Google Cloud access first (docs/release-plan.md). The bundle is saved with this run."
            track=""
          fi
          echo "track=$track" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          [ -n "$track" ] && echo "Sending to Play Console: track $track, status $status" || echo "Not sending to Play Console."
      - name: Sign in to Google Cloud without a key (Workload Identity Federation)
        id: gcp
        if: steps.play.outputs.track != '' && vars.GCP_WIF_PROVIDER != ''
        uses: google-github-actions/auth@71f986410dfbc7added4569d411d040a91dc6935 # v2.1.8
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - name: Send the bundle to Play Console
        if: steps.play.outputs.track != ''
        uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb # v1.1.3
        with:
          serviceAccountJson: ${{ steps.gcp.outputs.credentials_file_path }}
          serviceAccountJsonPlainText: ${{ steps.gcp.outputs.credentials_file_path == '' && secrets.PLAY_SERVICE_ACCOUNT_JSON || '' }}
          packageName: com.khoreh.duebydusk
          releaseFiles: mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ steps.play.outputs.track }}
          status: ${{ steps.play.outputs.status }}
          # Play's "What's new" text (mobile/release-notes/whatsnew-<language>)
          whatsNewDirectory: mobile/release-notes
      - name: Remove the upload key
        if: always()
        working-directory: .
        run: rm -f "$RUNNER_TEMP/upload.jks"

name: Play release bundle

# Builds a signed Android App Bundle (.aab) for Google Play (app ID com.khoreh.duebydusk).
# Run it from GitHub: Actions > Play release bundle > Run workflow, or push a tag: play-v0.10.0 builds with Google's
# demo ads (closed testing), play-prod-v0.10.0 with real ads (production, once the listing is live and linked in
# AdMob). Download the bundle from the run's artifacts and upload it in Play Console.
#
# Needs four repository secrets (Settings > Secrets and variables > Actions), made from your private upload key:
#   DBD_UPLOAD_KEYSTORE_BASE64  the upload keystore file, base64-encoded
#   DBD_UPLOAD_STORE_PASSWORD   the keystore password
#   DBD_UPLOAD_KEY_ALIAS        the key alias (for example "upload")
#   DBD_UPLOAD_KEY_PASSWORD     the key password
# See mobile/docs/release-plan.md for how to create the key.

on:
  workflow_dispatch:
    inputs:
      production_ads:
        description: 'Request real AdMob ads. Leave off for closed testing (shows Google demo ads).'
        type: boolean
        default: false
  push:
    tags: ['play-v*', 'play-prod-v*']

permissions:
  contents: read

concurrency:
  group: play-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check that the upload key secrets exist
        env:
          STORE: ${{ secrets.DBD_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.DBD_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DBD_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DBD_UPLOAD_KEY_PASSWORD }}
        working-directory: .
        run: |
          missing=""
          [ -n "$STORE" ] || missing="$missing DBD_UPLOAD_KEYSTORE_BASE64"
          [ -n "$STORE_PASSWORD" ] || missing="$missing DBD_UPLOAD_STORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing DBD_UPLOAD_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing DBD_UPLOAD_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Add these repository secrets before building a Play bundle:$missing"
            exit 1
          fi
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Test save recovery and game rules
        run: npm test
      - name: Build production assets
        env:
          VITE_ADMOB_PRODUCTION: ${{ (inputs.production_ads || startsWith(github.ref_name, 'play-prod-v')) && 'true' || 'false' }}
        run: npm run build
      - name: Sync native Android plugins and assets
        run: npx cap sync android
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            mobile/android/**/*.gradle
            mobile/android/gradle/wrapper/gradle-wrapper.properties
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Restore the upload key
        env:
          STORE: ${{ secrets.DBD_UPLOAD_KEYSTORE_BASE64 }}
        run: printf '%s' "$STORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
      - name: Build the signed release bundle
        env:
          DBD_UPLOAD_STORE_FILE: ${{ runner.temp }}/upload.jks
          DBD_UPLOAD_STORE_PASSWORD: ${{ secrets.DBD_UPLOAD_STORE_PASSWORD }}
          DBD_UPLOAD_KEY_ALIAS: ${{ secrets.DBD_UPLOAD_KEY_ALIAS }}
          DBD_UPLOAD_KEY_PASSWORD: ${{ secrets.DBD_UPLOAD_KEY_PASSWORD }}
        run: |
          # Play needs a higher versionCode on every upload; run numbers only go up.
          export DBD_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          echo "versionCode $DBD_VERSION_CODE, production ads: ${{ inputs.production_ads || startsWith(github.ref_name, 'play-prod-v') }}"
          bash android/gradlew -p android --no-daemon bundleRelease
      - name: Check the bundle is signed
        run: |
          aab=android/app/build/outputs/bundle/release/app-release.aab
          if ! keytool -printcert -jarfile "$aab" | tee "$RUNNER_TEMP/signer.txt" | grep -q 'SHA256:'; then
            echo "::error::The bundle is not signed with the upload key."
            exit 1
          fi
          grep -E 'Owner:|SHA256:' "$RUNNER_TEMP/signer.txt"
      - name: Save the bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: due-by-dusk-play-${{ github.run_number }}
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
      - name: Remove the upload key
        if: always()
        working-directory: .
        run: rm -f "$RUNNER_TEMP/upload.jks"

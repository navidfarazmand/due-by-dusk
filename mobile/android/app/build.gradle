apply plugin: 'com.android.application'

android {
    // The Java namespace stays as created; the Play app ID below is what players and Google Play see.
    namespace = "com.navidfarazmand.duebydusk"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        // Google Play app ID (permanent): created in Play Console on 27 Oct 2026.
        applicationId "com.khoreh.duebydusk"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Every Play upload needs a higher versionCode; the release workflow passes DBD_VERSION_CODE.
        versionCode((System.getenv('DBD_VERSION_CODE') ?: '10') as int)
        versionName "0.9.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Public development key only. Never use this configuration for a store release.
    signingConfigs {
        debug {
            storeFile file('test-signing/public-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storeType 'JKS'
        }
        // Private Play upload key. It comes from CI secrets (see .github/workflows/release-aab.yml)
        // or from your own ~/.gradle/gradle.properties. Never commit the key or its passwords.
        release {
            def uploadStore = System.getenv('DBD_UPLOAD_STORE_FILE') ?: project.findProperty('dbdUploadStoreFile')
            if (uploadStore) {
                storeFile file(uploadStore)
                storePassword System.getenv('DBD_UPLOAD_STORE_PASSWORD') ?: project.findProperty('dbdUploadStorePassword')
                keyAlias System.getenv('DBD_UPLOAD_KEY_ALIAS') ?: project.findProperty('dbdUploadKeyAlias')
                keyPassword System.getenv('DBD_UPLOAD_KEY_PASSWORD') ?: project.findProperty('dbdUploadKeyPassword')
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (signingConfigs.release.storeFile != null) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// Test APKs keep their original ID (com.navidfarazmand.duebydusk.testing), so new test builds still
// update the installed "Due by Dusk Test" app and keep its saves. Only the Play build uses com.khoreh.duebydusk.
androidComponents {
    onVariants(selector().withBuildType('debug')) { variant ->
        variant.applicationId.set('com.navidfarazmand.duebydusk.testing')
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
